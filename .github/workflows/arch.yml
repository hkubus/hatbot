# Builds the Linux app's Arch package and puts it in Forgejo's pacman repository (infra/README.md).
name: Arch package

on:
  push:
    branches: [main]
    paths:
      - apps/linux/**
      - .github/workflows/arch.yml
  # Rebuilds the package when Arch's libraries move under it; publish.sh skips it otherwise.
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40
    concurrency: arch-package
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git jq rust libxkbcommon wayland dbus
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # makepkg won't run as root.
      - name: Build and publish
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder --preserve-env=FORGEJO_TOKEN apps/linux/packaging/publish.sh
