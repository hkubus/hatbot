name: Linux

on:
  push:
    paths:
      - apps/linux/**
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - apps/linux/**
      - .github/workflows/linux.yml
  # Rebuilds the package when Arch's libraries move under it; publish.sh skips it otherwise.
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - name: Install GTK, libadwaita, libsoup, libsecret, WebKitGTK and Rust
        working-directory: /
        run: pacman -Syu --noconfirm --needed gtk4 libadwaita libsoup3 libsecret webkitgtk-6.0 rust gcc pkgconf
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # A container job can't run cargo-deny's own container action, so this one runs beside it.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/linux/Cargo.toml
          command: check licenses

  # Builds the Arch package and puts it in Forgejo's pacman repository (apps/linux/README.md).
  publish:
    needs: [check, licenses]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    concurrency: arch-package
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git jq gtk4 libadwaita libsoup3 libsecret webkitgtk-6.0 rust
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # makepkg won't run as root.
      - name: Build and publish
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder --preserve-env=FORGEJO_TOKEN apps/linux/arch/publish.sh
