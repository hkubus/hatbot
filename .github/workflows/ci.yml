# Lint, typecheck, tests and the web build for the Bun workspaces, and checks of the infra scripts.
# Runs on the GitHub mirror of git.gaycats.ovh/kubus/hatbot.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run licenses
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/web build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck nftables gettext-base
      - name: shellcheck
        working-directory: infra
        run: shellcheck -x *.sh
      # The desktop's firewalls (host-setup.sh's and its own), in throwaway network namespaces.
      - run: sudo bash infra/test-firewall.sh
