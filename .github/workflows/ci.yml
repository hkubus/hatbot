# Runs on the GitHub mirror of git.gaycats.ovh/kubus/hatbot.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run licenses
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/web build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck nftables gettext-base
      - name: shellcheck
        working-directory: infra
        run: shellcheck -x *.sh ../plugins/*/infra/*.sh
      # The guests' firewalls (host-setup.sh's and their own), in throwaway network namespaces.
      - run: sudo bash infra/test-firewall.sh

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # sway runs headless for the Wayland tests; grim checks their screenshots.
      - run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwebkit2gtk-4.1-dev
          libgtk-3-dev libgtk-layer-shell-dev sway grim
      # The app's own pages are built into the binary.
      - run: bun install --frozen-lockfile && bun run build
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          HATBOT_WAYLAND_TESTS: "1"

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile && bun run build
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The installer: NSIS, for the current user, no administrator needed.
      - run: bunx @tauri-apps/cli@2.12.4 build --bundles nsis
        working-directory: apps/desktop/app
      - uses: actions/upload-artifact@v7
        with:
          name: hatbot-windows
          path: apps/desktop/target/release/bundle/nsis/*.exe
