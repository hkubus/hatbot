# The Xcode project, generated with XcodeGen (`xcodegen generate`); the .xcodeproj isn't committed.
name: Hatbot
options:
  bundleIdPrefix: ovh.gaycats
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hatbot:
    type: application
    platform: iOS
    sources:
      - path: Hatbot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ovh.gaycats.hatbot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hatbot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Hatbot/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ovh.gaycats.hatbot
            CFBundleURLSchemes: [hatbot]
        # Plain http to the brain on the LAN (192.168.55.x:8080); everything else needs TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Hatbot connects to your brain on the local network.
  HatbotCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HatbotCoreTests
    dependencies:
      - target: Hatbot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hatbot:
    build:
      targets:
        Hatbot: all
    test:
      targets:
        - HatbotCoreTests
