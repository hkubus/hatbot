# The Xcode project, generated with XcodeGen (`xcodegen generate`); the .xcodeproj isn't committed.
name: Hatbot
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    # The reverse domain the bundle ids, the App Group and the widget kinds are named under; the code
    # reads it from Info.plist. build-ipa.sh takes BUNDLE_PREFIX from the environment if it's set.
    BUNDLE_PREFIX: com.example
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hatbot:
    type: application
    platform: iOS
    sources:
      - path: Hatbot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hatbot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hatbot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Hatbot/Info.plist
      properties:
        HatbotBundlePrefix: $(BUNDLE_PREFIX)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [hatbot]
        # Home-screen quick actions: each type is the hatbot:// link it opens (App/Extras.swift).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: hatbot://new
            UIApplicationShortcutItemTitle: New Message
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: hatbot://live
            UIApplicationShortcutItemTitle: Live
            UIApplicationShortcutItemIconSymbolName: display
          - UIApplicationShortcutItemType: hatbot://tasks
            UIApplicationShortcutItemTitle: Tasks
            UIApplicationShortcutItemIconSymbolName: checklist
        # Only https, on the LAN too (API.serverURL); a brain on the LAN still needs this to be reached.
        NSLocalNetworkUsageDescription: Hatbot connects to your brain on the local network.
    # Shared with the share extension: the brain's address and the token (Hatbot/App/AppGroup.swift).
    entitlements:
      path: Hatbot/Hatbot.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_PREFIX).hatbot"]
    dependencies:
      - target: HatbotShare
      - target: HatbotWidgets
  # The share sheet's Hatbot. It's a second App ID in SideStore.
  HatbotShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Hatbot/Core
      - path: Hatbot/App/AppGroup.swift
      - path: Hatbot/App/KeychainVault.swift
      - path: Hatbot/Views/PickedFile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hatbot.share
        # Swift 5 for NSItemProvider's callbacks.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hatbot
    info:
      path: Share/Info.plist
      properties:
        HatbotBundlePrefix: $(BUNDLE_PREFIX)
        CFBundleDisplayName: Hatbot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: Share/HatbotShare.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_PREFIX).hatbot"]
  # The home-screen widget and the Pause all control. A third App ID in SideStore.
  HatbotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Hatbot/Core
      - path: Hatbot/App/AppGroup.swift
      - path: Hatbot/App/KeychainVault.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hatbot.widgets
        # Swift 5, like the share extension: WidgetKit's callbacks predate strict concurrency.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hatbot
    info:
      path: Widgets/Info.plist
      properties:
        HatbotBundlePrefix: $(BUNDLE_PREFIX)
        CFBundleDisplayName: Hatbot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HatbotWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_PREFIX).hatbot"]
  HatbotCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HatbotCoreTests
    dependencies:
      - target: Hatbot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hatbot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hatbot:
    build:
      targets:
        Hatbot: all
    test:
      targets:
        - HatbotCoreTests
