[package]
name = "hatbot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hatbot-agent = { path = "../agent" }
iced = { version = "0.14", features = ["tokio", "markdown", "svg", "image", "canvas", "advanced"] }
iced_layershell = "0.19"
# iced_layershell 0.19 builds only against the beta.2 of these; later betas break it.
winit-core = "=0.31.0-beta.2"
winit-common = { version = "=0.31.0-beta.2", default-features = false }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = "0.3"
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
jiff = "0.2"

[dev-dependencies]
