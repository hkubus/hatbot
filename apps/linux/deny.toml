# Every crate must be permissive. GTK, libadwaita, GLib, libsoup, libsecret and WebKitGTK are LGPL,
# but they're system libraries the app links dynamically and never ships; their Rust bindings are MIT.
[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

