[package]
name = "hatbot-agent"
description = "Lets Hatbot use the owner's Linux computer: the brain's side of the Linux app."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
atspi = { version = "0.30", default-features = false, features = ["proxies", "tokio", "connection"] }
base64 = "0.22"
calloop = "0.14"
calloop-wayland-source = "0.4"
evdev = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.9"
rustix = { version = "1", features = ["fs", "mm", "pipe", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing = "0.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
