[package]
name = "hatbot-agent"
description = "Lets Hatbot use the owner's computer: the brain's side of the desktop app."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["proxies", "tokio", "connection"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
evdev = "0.13"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "mm", "pipe", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSEvent",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFData",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGImage",
    "CGRemoteOperation",
    "CGSession",
    "CGWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSError",
    "NSString",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-graphics",
    "SCError",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
