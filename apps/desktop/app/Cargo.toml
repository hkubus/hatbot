[package]
name = "hatbot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Off only for `cargo run --no-default-features` against the pages' dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
hatbot-agent = { path = "../agent" }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
ring = "0.17"
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
ksni = "0.3"
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
