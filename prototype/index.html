<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <title>Hatbot — prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="toolbar" id="toolbar"></header>
      <section class="view" id="view"></section>
      <div class="composer-wrap" id="composer-wrap"></div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>
  <div class="scrim" data-action="close-sheet"></div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <div class="login" id="login" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
